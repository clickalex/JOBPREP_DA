name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            website/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r website/requirements.txt
      - id: pages
        uses: actions/configure-pages@v6
      - name: Stage docs (markdown, playground data, flashcards, rendered notebook)
        run: python website/build_site.py
      - name: Build site (fails on broken links)
        run: mkdocs build --strict -f website/mkdocs.yml
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_NAME: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
